name: Whisky compatibility launcher builds

on:
  workflow_dispatch:
  push:
    branches: [codex/whisky-compat]

permissions:
  contents: read

concurrency:
  group: whisky-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher:
    if: github.repository != 'openkogama/openkogama-launcher'
    name: Qt ${{ matrix.qt }} / Windows x64
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        qt: ["6.8.3", "6.10.2"]
    defaults:
      run:
        shell: pwsh
    env:
      QT_VERSION: ${{ matrix.qt }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools qtsvg qttranslations
          cache: true
          cache-key-prefix: whisky-msvc-qt
      - name: Configure launcher only
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_CXX_COMPILER=cl -DCMAKE_INSTALL_BINDIR=. `
            -DOPENKOGAMA_PORTABLE_TEST_BUILD=ON -DBUILD_TESTING=ON `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DOPENKOGAMA_BUILD_REVISION=$env:GITHUB_SHA"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build launcher and tests
        run: |
          cmake --build build --parallel 2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Run launcher regression tests
        run: |
          ctest --test-dir build --output-on-failure --timeout 120
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Deploy portable launcher
        run: |
          cmake --install build --prefix "$PWD/portable"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item LICENSE portable/LICENSE.txt
          Copy-Item WHISKY-COMPAT.md portable/
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            qt = $env:QT_VERSION
            architecture = 'Windows x64'
            compiler = 'MSVC 2022'
            configuration = 'RelWithDebInfo'
            updater = 'disabled'
            wineCompatibility = 'not yet verified'
          } | ConvertTo-Json | Set-Content portable/build-info.json -Encoding utf8
      - name: Verify portable files and native Windows Qt startup
        run: |
          $required = @('openkogama-launcher.exe', 'Qt6Core.dll', 'Qt6Gui.dll',
            'Qt6Widgets.dll', 'Qt6Network.dll', 'platforms/qwindows.dll',
            'iconengines/qsvgicon.dll', 'tls/qschannelbackend.dll',
            'msvcp140.dll', 'vcruntime140.dll')
          foreach ($file in $required) {
            if (!(Test-Path "portable/$file")) { throw "Missing portable dependency: $file" }
          }
          $exe = (Resolve-Path portable/openkogama-launcher.exe).Path
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664) { throw 'Executable is not x64' }
          $version = (Get-Item portable/Qt6Core.dll).VersionInfo.FileVersion
          if ($version -notlike "$env:QT_VERSION*") { throw "Unexpected Qt runtime: $version" }
          # Remove access to the Qt SDK to check that deployment is self-contained.
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          foreach ($name in @('QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH', 'QT_QPA_PLATFORMTHEME',
              'QT_STYLE_OVERRIDE', 'QT_LOGGING_RULES', 'QML2_IMPORT_PATH')) {
            [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          $env:QT_QPA_PLATFORM = 'windows'
          $env:OPENKOGAMA_STARTUP_LOG = "$PWD/build/native-smoke-startup.log"
          $process = Start-Process -FilePath $exe -WorkingDirectory "$PWD/portable" `
            -ArgumentList '--qt-smoke-test', '--diagnostic', '--smoke-test-timeout-ms=1500' -PassThru
          if (!$process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Native Windows smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Native Windows smoke test exited $($process.ExitCode)" }
          $log = Get-Content $env:OPENKOGAMA_STARTUP_LOG -Raw
          if ($log -notmatch 'after smoke window show' -or $log -notmatch 'event loop exited: 0') {
            throw 'Native Windows smoke test did not reach the expected phases'
          }
          Get-ChildItem portable -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath("$PWD/portable", $_.FullName).Replace('\', '/')
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $relative"
          } | Set-Content portable/SHA256SUMS.txt -Encoding ascii
          "Built Qt $env:QT_VERSION Windows x64; regression tests and deployed native Qt smoke test passed. Wine 11.19 remains unverified." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload portable test launcher
        uses: actions/upload-artifact@v4
        with:
          name: OpenKoGaMa-Whisky-Qt-${{ matrix.qt }}
          path: portable/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Whisky-build-diagnostics-Qt-${{ matrix.qt }}
          path: |
            build/launcher-tests.txt
            build/Testing/Temporary/
            build/native-smoke-startup.log
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 30
